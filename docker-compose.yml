name: rag-knowledge-base

services:
  api:
    build: .
    container_name: rag-api
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      qdrant:
        condition: service_started
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: rag-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-rag_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_knowledge_base}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_PASSWORD:-rag_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
  mysql_data:
